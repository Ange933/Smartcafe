version: '3.8'

services:
  # Base de données PostgreSQL
  database:
    image: postgres:15-alpine
    container_name: smartcafe-database
    environment:
      POSTGRES_USER: smartcafe
      POSTGRES_PASSWORD: smartcafe123
      POSTGRES_DB: smartcafe_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - smartcafe-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcafe -d smartcafe_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartcafe-backend
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: smartcafe_db
      DB_USER: smartcafe
      DB_PASSWORD: smartcafe123
      JWT_SECRET: votre_secret_jwt_super_securise_changez_moi_en_production
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      database:
        condition: service_healthy
    networks:
      - smartcafe-network
    command: npm run dev

  # Frontend Web
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartcafe-frontend
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - smartcafe-network
    command: npm run dev

volumes:
  postgres_data:
    driver: local

networks:
  smartcafe-network:
    driver: bridge
